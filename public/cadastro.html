<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cadastro.css">
    <title>Cadastro do Pet com Imagem</title>
</head>
<body>
    <div class="login-card">
        <h2>Cadastrar Pet</h2>
        <form id="petForm">
            <input type="text" id="tutor" placeholder="Nome do Tutor" required>
            <input type="text" id="nomePet" placeholder="Nome do Animal" required>
            <input type="text" id="raca" placeholder="Raça" required>

            <select id="genero" name="opcoes">
                <option value="">Gênero ...</option>
                <option value="Fêmea">Fêmea</option>
                <option value="Macho">Macho</option>
            </select>
            
            <input type="text" id="peso" step="0.1" placeholder="Peso (kg)" required>
            <input type="text" id="idade" placeholder="Idade (anos)" required>

            <label for="imagem">Foto do Pet:</label>
            <input type="file" id="imagem" accept="imagem/*" required>
            
            <button id="button">Cadastrar</button>
        </form>
        
    </div>
    <script src="cadastro.js"></script>
</body>
</html>
