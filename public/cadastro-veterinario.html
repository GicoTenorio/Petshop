<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrao de veterinários</title>
    <script src="cadastro-veterinario.js"></script>
</head>
<body>
    <form id="cadastro-vet">
        <div class="input-group">
            <label>Nome</label>
            <input type="text" name="nome" id="nome" placeholder="Digite o nome">
        </div>
        <div class="input-group">
            <label>CFMV</label>
            <input type="text" name="CFMV" id="cfmv" placeholder="Digite o CFMV do veterinário">
        </div>
        <div>
            <label>Especialidade</label>
            <input type="text" name="especialidade" id="especialidade" placeholder="Digite a especialidade do veterinário">
        </div>
        <button type="button" class="btn-submit">Salvar</button>
    </form>
</body>
</html>
